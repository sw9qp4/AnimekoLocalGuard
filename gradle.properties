kotlin.code.style=official
# Test frameworks are configured explicitly in build-logic. Inference selects JUnit 4
# for Android device tests once IDE import realizes their tasks, conflicting with JUnit 5.
kotlin.test.infer.jvm.variant=false
android.useAndroidX=true
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx4096M"
# Project version, automatically updated by task :ci-helper:updateDevVersionNameFromGit
version.name=4.9.0-dev
# package.version must be major.minor.patch without meta
package.version=5.0.0
kotlin.mpp.androidSourceSetLayoutVersion=2
org.gradle.caching=true
org.gradle.configuration-cache=true
# `android.version.code` is a fixed constant and is NOT updated by CI.
# Keeping it constant lets users who updated to a broken beta reinstall an older build.
# \u8FD9\u4E2A\u4E0D\u4F1A\u66F4\u65B0, \u4F46\u7531\u4E8E\u4E00\u6B21\u5931\u8BEF, \u5B83\u88AB\u66F4\u65B0\u5230\u4E86 50406
android.version.code=50406
# iOS CFBundleVersion. CI replaces this with a value derived from the release tag:
# major.minor.(patch*100+meta), meta: alpha 1..29, beta 31..59, stable 99.
# E.g. v6.1.0-alpha01 -> 6.1.1, v6.1.0-beta01 -> 6.1.31, v6.1.0 -> 6.1.99, v6.1.1 -> 6.1.199.
# See ReleaseArtifactNames.iosBundleVersionFromTag in build-logic.
ios.version.code=50406
# TODO AGP Migration: Test android sdk 36
android.compile.sdk=37
android.min.sdk=27
# JBR must have JCEF bundled
jvm.toolchain.vendor=jetbrains
jvm.toolchain.version=21
# ---------------------------------------------------------------------------
# AnimekoLocalGuard 本机局部设置（非上游内容）
#
# 让 Gradle 的 toolchain 自动探测能找到项目自带的 JDK 21。
# 本机 DNS 无法解析 cache-redirector.jetbrains.com 与 *.cloudfront.net，
# 因此取不到上游要求的 JBR（vendor=jetbrains）；vendor 已在 local.properties
# 中覆盖为 temurin，这里再显式给出 JDK 位置。
#
# 这是本机开发环境所需的一行，不属于上游功能改动。换机器时需同步修改。
# ---------------------------------------------------------------------------
org.gradle.java.installations.paths=D:\\al-tools\\jdk21\\jdk-21.0.12.1+1
# AGP 默认拒绝非 ASCII 的项目路径（本工作区为 D:\模型\...）。
# 这是 AGP 官方提供的开关；开启后 AGP 不再因路径含非 ASCII 字符而中止。
# 风险: Windows 上非 ASCII 路径对 NDK / 原生编译任务有已知问题。本机 Android 目标
# 主要依赖预编译 native 产物；若后续出现原生编译相关的路径类错误, 应把工程迁到纯 ASCII 路径。
android.overridePathCheck=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.apple.xcodeCompatibility.nowarn=true
kotlin.native.ignoreDisabledTargets=true
kotlin.native.enableKlibsCrossCompilation=false
