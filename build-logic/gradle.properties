# AnimekoLocalGuard 本机局部设置（非上游内容）
#
# 本目录 build-logic 是一个 included build，**不会**继承仓库根的 gradle.properties。
# AGP 在 :build-logic:generatePrecompiledScriptPluginAccessors 中应用
# com.android.application 时会做非 ASCII 路径检查，而该检查读取的是
# **当前工程自己的** gradle.properties，因此必须把开关放在这里。
#
# 背景: 本工作区路径为 D:\模型\...，含非 ASCII 字符，AGP 默认拒绝。
# 该开关是 AGP 官方提供的绕过方式。
#
# 注意: 这只是绕过 AGP 的检查，并不解决非 ASCII 路径在 Windows 上对 NDK /
# 原生编译任务的已知问题。工程迁到纯 ASCII 路径后，本文件可以删除。
android.overridePathCheck=true
